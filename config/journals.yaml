# 目标期刊注册表（20 本顶刊）。可增删条目。
# 采集框架：5 年（2020-2024）× 20 本顶刊 × 每刊每年取量化论文前 20 篇（按引用数）
#           = 2000 篇上限（小刊或薄年份不足 20 篇时取全部，故为上限非保证）。
# 字段：
#   slug         文件系统与数据库用的短标识（小写，连字符）
#   name         期刊全称
#   issn         ISSN-L（OpenAlex 通过 issn 过滤解析 source）
#   category     分组：core_finance / microstructure_quant / management_stats
#   include_all  true 表示本质量化期刊，全部论文纳入；false 表示按相关性筛选
#   source_id    OpenAlex Source ID（可留空，resolve-sources 会自动解析并回填缓存）

journals:
